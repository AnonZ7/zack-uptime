name: uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-
      - run: bash check.sh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: uptime-state-${{ github.run_id }}
  # GitHub pauses scheduled workflows after 60 days without repo activity; a monthly commit keeps it alive.
  keepalive:
    if: github.event.schedule == '*/10 * * * *' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ "$(date -u +%d)" = "01" ] || exit 0
          [ "$(cat keepalive.txt 2>/dev/null)" = "$(date -u +%F)" ] && exit 0
          date -u +%F > keepalive.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add keepalive.txt && git commit -m "chore: monthly keepalive" && git push
